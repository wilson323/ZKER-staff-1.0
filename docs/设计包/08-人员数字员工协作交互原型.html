{id:'agent-proposal',kind:'AGENT',name:'采购方案数字员工',version:'3',purpose:'依据技术与预算贡献撰写采购方案，保留来源引用。',publisher:'采购能力维护组',visible:['main','review','designer','resource'],copy:['main','designer','resource'],readiness:'READY',dependency:'已批准写作技能与采购规范'},
{id:'agent-budget',kind:'AGENT',name:'预算测算数字员工',version:'2',purpose:'核对设备数量、币种和预算合计，输出可复核预算表。',publisher:'财务能力维护组',visible:['main','collab','resource'],copy:['main','collab','resource'],readiness:'READY',dependency:'已批准预算校验技能'},

{id:'skill-reference',kind:'SKILL',name:'采购规范检查说明',version:'1',purpose:'查看企业规范检查方法和适用范围，当前分享只允许阅读。',publisher:'采购规范维护组',visible:['main','collab','review','designer','resource'],copy:[],readiness:'NEEDS_AUTHORIZATION',dependency:'当前发布范围仅允许查看'},

{id:'agent-finance-internal',kind:'AGENT',name:'内部资金分析数字员工',version:'1',purpose:'仅向该演示授权范围内的资源维护者提供。',publisher:'财务受限资源组',visible:['resource'],copy:['resource'],readiness:'READY',dependency:'限定发布范围'}
];

function nodeUser(){if(oa&&oaCustom())return profile().market&&oaItem().kind!=='review'&&oaPending(oaItem());if(oa&&!oa.legacyContext)return false;return ['main','collab','tech','writer'].includes(state.role)||(state.role==='member'&&roleData.claimed)||(state.role==='receiver'&&roleData.receiverAccepted)}

 var c=marketCopies[state.role][r.id],actions=marketAction('查看详情',r.id,'detail',false);
 if(mayCopy(r))actions+=c?(c.readiness==='READY'&&nodeUser()?marketAction('用于本节点',r.id,'use',true):marketAction('查看我的副本',r.id,'my-copy',true)):marketAction(r.readiness==='READY'&&nodeUser()?'复制并使用':'复制到我的'+kindText[r.kind],r.id,'copy',true);

function marketDetail(id,setup){
 var r=visibleMarket().find(function(x){return x.id===id});
 if(!r){notify('对象不存在或无权查看。');return false}
 if(!marketUI.open){marketUI.open=true;renderMarket()}
 var c=marketCopies[state.role][r.id],el=document.getElementById('market-detail');

 var template=oaTemplates.find(t=>t.id===payload.type),seq=++oa.sequence,id='pi-new-'+seq,num={purchase:'CG',contract:'HT',expense:'BX',people:'HR'}[payload.type]+'-20260911-'+String(seq).padStart(3,'0');oa.instances.push({id:id,type:payload.type,number:num,title:payload.title.trim(),version:template.version,startedAt:oa.now,state:'running',contextRevision:1,initiators:[state.role],nudges:{},form:JSON.parse(JSON.stringify(form)),unactivatedSteps:3});oa.items.push({id:'t-'+state.role+'-'+id,instanceId:id,owner:state.role,candidate:null,title:'补齐申请依据',nodeKey:'application-evidence',stageIndex:0,round:1,kind:'execution',status:'TODO',handled:false,read:false,rev:1,contextRevision:1,formRevision:1,draft:'',config:{agent:'本任务专用助手',mode:'人机协助',skill:null,tool:null},chat:[],events:['创建本次申请；按实例冻结模板版本'],legacy:false,dueAt:'2026-09-12T17:00:00+08:00',priority:2,receipt:null});oaNormalizeTask(oa.items.at(-1));oa.requestCache[cachekey]={hash:hash,id:id};return id}

function oaAction(action,id){var t=oaItem(id),i=t?oaInst(t):null;var fail=function(s){notify(s);return false};if(action==='basis'){return window.oaDemo.updateBasis(oaItem()?.instanceId)}if(action==='back'){oa.selected=null;oa.legacyContext=false;marketUI.open=false;workspaceView='dashboard';render();return true}if(action==='open')return oaOpen(id);if(action==='clear'){oaResetFilter();render();return true}if(action==='prev'||action==='next'){oa.page+=action==='next'?1:-1;render();return true}if(action==='new'){if(!oaCanStart())return fail('当前操作权已撤销。');oaNew();return true}
 if(action==='create'){var type=oaTemplates.find(x=>x.name===val('oa-new-type',''));var nid=oaCreate({type:type?.id,title:val('oa-new-title',''),form:type?oaReadNewForm(type.id):null},oa.newIntent);if(!nid)return fail('请填写事务名称和本模板必填字段，检查日期及金额；同一次提交不能修改载荷。');document.getElementById('ui-detail').close();oa.tab='started';oaResetFilter();workspaceView='dashboard';marketUI.open=false;render();notify('新事务已登记，每笔独立编号与上下文。');return true}
 if(action==='instance'||action==='nudge'||action==='withdraw'){var inst=oaInst(id);if(!inst||!inst.initiators.includes(state.role)||!oaScopeRows().some(x=>x.instanceId===id))return fail('对象不存在或无权查看。');if(action==='instance'){openRoleDialog('事务流转记录',infoRows([['业务单号',inst.number],['流程版本','v'+inst.version],['实例状态',humanText(inst.state)],['本人可见节点',oaScopeRows().filter(x=>x.instanceId===id).map(x=>x.title+'：'+oaStatus(x)).join('；')],['未激活阶段',inst.unactivatedSteps+' 个后续模板阶段（示例）；非实时执行状态']])+oaButton('withdraw','申请撤回本笔事务',inst.state!=='running','data-id="'+id+'"'));return true}if(roleRevoked[state.role])return fail('当前操作权已撤销。');if(action==='nudge'){if(inst.state!=='running')return fail('当前实例不允许催办。');if(inst.nudges[state.role])return fail('该实例已登记催办，请等待冷却窗口。');inst.nudges[state.role]=true;notify('仅记录本笔实例的催办请求，未发送外部消息。');return true}if(action==='withdraw'){if(inst.state!=='running'||oa.items.some(x=>x.instanceId===id&&x.receipt))return fail('已有处理回执，需按撤回策略检查；不能直接撤销。');inst.state='cancelled';oa.items.filter(x=>x.instanceId===id&&x.status!=='CC').forEach(x=>{x.status='CANCELLED';x.rev++});document.getElementById('ui-detail').close();render();return true}}
 if(action==='read-batch'){if(roleRevoked[state.role])return fail('当前操作权已撤销。');var chosen=oa.selectedRead.map(oaItem);if(!chosen.length||chosen.some(x=>!oaVisible(x)||x.status!=='CC'))return fail('所选抄送已变化，请刷新。');chosen.forEach(x=>x.read=true);oa.selectedRead=[];render();return true}
 if(!oaVisible(t)||t.owner!==state.role&&t.candidate!==state.role)return fail('对象不存在或无权查看。');if(roleRevoked[state.role])return fail('当前操作权已撤销。');if(action==='read'){if(t.status!=='CC')return false;t.read=true;render();return true}if(action==='claim'){if(t.status!=='UNCLAIMED'||t.owner!==null||t.candidate!==state.role)return fail('任务已被领取或不在候选范围。');t.owner=state.role;t.status='TODO';t.rev++;t.events.push('本人领取该任务');render();return true}
 if(!oaPending(t)||t.owner!==state.role||i.state!=='running')return fail('本任务已变化，当前不能处理。');if(action==='save'){t.draft=val('oa-draft',t.draft);if(profile().market&&t.kind!=='review'){t.config.agent=val('oa-agent',t.config.agent);t.config.mode=val('oa-mode',t.config.mode)}t.events.push('保存本任务草稿和配置');t.rev++;render();return true}if(action==='chat'){var msg=val('oa-chat-input','').trim();if(!msg)return false;t.chat.push(msg);render();return true}if(action==='market'){if(!profile().market||t.kind==='review')return fail('本任务没有市场配置权限。');goView('market');return true}if(action==='rebase'){t.contextRevision=i.contextRevision;t.events.push('显式重核实例依据 v'+i.contextRevision);t.rev++;render();return true}
 if(['submit','approve','return'].includes(action)){if(t.contextRevision!==i.contextRevision)return fail('当前依据过期，先重核。');var note=val('oa-draft',t.draft).trim();if(!note)return fail('填写处理说明或决定理由。');if(action==='submit'){if(t.kind==='review')return fail('审核任务不能作为普通处理提交。');t.draft=note;t.status='WAITING_REVIEW';t.handled=true;t.rev++;t.events.push('本节点已提交；等待独立审核，流程未结束');var rid='approval-'+t.id+'-r'+t.round;oa.items.push({...JSON.parse(JSON.stringify(t)),id:rid,owner:t.owner==='review'?'approver':'review',candidate:null,kind:'review',stageIndex:2,status:'TODO',handled:false,title:'审核 '+t.title,legacy:false,draft:'',chat:[],events:['由本任务提交产生独立审核'],workItemId:'wi-'+rid,humanTaskId:'ht-'+rid,sourceTaskId:t.id,sourceRevision:t.rev,requester:t.owner,config:{agent:'人工审核',mode:'人工执行',skill:null,tool:null}})}else {if(t.kind!=='review'||t.requester===state.role)return fail('只有指定且独立的审核人可决定。');var src=t.sourceTaskId?oaItem(t.sourceTaskId):null;if(!src)return fail('目标提交版本尚未加载，不能作出审核决定。');if(src&&(src.rev!==t.sourceRevision||src.status!=='WAITING_REVIEW'||src.contextRevision!==i.contextRevision))return fail('被审版本已变化，请重新获取审批任务。');t.draft=note;t.handled=true;t.status='COMPLETED';t.receipt=action==='approve'?'approved':'returned';t.events.push(action==='approve'?'记录本任务的独立审核通过':'记录退回理由，不关闭流程');if(src){src.status=action==='approve'?'COMPLETED':'RETURNED';src.handled=action==='approve';src.receipt=action==='approve'?'approved':null;src.rev++;if(action==='return'){src.round++;src.humanTaskId='ht-'+src.id+'-r'+src.round;src.contextRevision=i.contextRevision}src.events.push('审核意见：'+note)}}render();return true}
 return fail('当前任务无此操作。');
}
function oaUseCopy(id){var t=oaItem(),c=marketCopies[state.role][id],r=visibleMarket().find(x=>x.id===id);if(!oaCustom()||!oaPending(t)||t.kind==='review'||t.owner!==state.role||roleRevoked[state.role]||!c||!r||c.readiness!=='READY')return false;if(c.kind==='AGENT')t.config.agent=c.name;if(c.kind==='SKILL')t.config.skill=c.localId;if(c.kind==='TOOL')t.config.tool=c.localId;t.events.push('从本人资源选择 '+c.name);marketUI.open=false;workspaceView='node';render();notify('仅选入 '+oaInst(t).number+' / '+t.title+'。');return true}
// UI changes and request dispatch only; no production operations.
document.body.addEventListener('click',function(e){var tab=e.target.closest('[data-oa-tab]');if(tab){oa.tab=tab.dataset.oaTab;oaResetFilter();render();return}var a=e.target.closest('[data-oa-action]');if(a&&!a.disabled)oaAction(a.dataset.oaAction,a.dataset.id)});
document.body.addEventListener('input',function(e){if(e.target.id==='oa-draft'&&oaCustom()&&oaPending(oaItem()))oa.drafts[oa.selected]=e.target.value;if(e.target.id==='oa-search'){oa.search=e.target.value;oa.page=1;renderOADashboard();var q=document.getElementById('oa-search');q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
document.body.addEventListener('change',function(e){if(e.target.id==='oa-new-type'){var template=oaTemplates.find(t=>t.name===e.target.value);document.getElementById('oa-new-fields').innerHTML=oaNewFields(template.id);return}if(e.target.id==='oa-type'||e.target.id==='oa-due'){oa[e.target.id==='oa-type'?'type':'due']=e.target.value;oa.page=1;render();return}if(e.target.matches('[data-oa-select]')){var id=e.target.dataset.oaSelect;oa.selectedRead=e.target.checked?[...new Set([...oa.selectedRead,id])]:oa.selectedRead.filter(x=>x!==id);render()}});
window.oaDemo={snapshot:()=>JSON.parse(JSON.stringify(oa)),open:oaOpen,action:oaAction,create:oaCreate,updateBasis:function(id){var i=oaInst(id);if(!i||i.state!=='running'||!oaScopeRows().some(t=>t.instanceId===id)||roleRevoked[state.role])return false;if(id==='pi-001'){if(state.committed)return false;state.baseline++;state.contribution='needs_recheck';state.approved=false;roleData.writerContribution='needs_recheck';i.contextRevision=state.baseline;}else{i.contextRevision++;}oa.items.filter(t=>t.instanceId===id&&!t.legacy).forEach(function(t){if(t.sourceTaskId&&oaPending(t)){t.status='SUPERSEDED';t.handled=false;t.events.push('依据已变化，本审批版本失效');}else if(oaPending(t)||t.status==='WAITING_REVIEW'){if(t.status==='WAITING_REVIEW'){t.round++;t.humanTaskId='ht-'+t.id+'-r'+t.round;}t.status='NEEDS_RECHECK';t.handled=false;t.rev++;}});render();return true}};
oaInit();
var oaParams=new URLSearchParams(location.search);oa.legacyContext=oaParams.get('view')==='node'&&!oaParams.get('task');if(oaParams.get('task')){var target=oaItem(oaParams.get('task'));if(oaVisible(target)&&(!oaParams.get('case')||oaParams.get('case')===target.instanceId)){oa.selected=target.id;workspaceView='node'}else{workspaceView='forbidden'}}

window.designState=function(){return JSON.parse(JSON.stringify(state))};
render();
})();
</script></body></html>
