/* EXECUTION_WORKSPACE_CSS_START */
/* Inlined into the single-file design prototype. Desktop conversation + artifact canvas. */
.execution-mode .shell{grid-template-columns:64px minmax(0,1fr)}
.execution-mode aside{padding:20px 6px}.execution-mode .brand{padding:0 8px 14px}
.execution-mode .brand>div:last-child,.execution-mode .person,.execution-mode .nav-group{display:none}
.execution-mode nav button{font-size:0;text-align:center;padding:12px 5px}.execution-mode .nav-icon{font-size:13px;width:auto}
.execution-mode main{padding:14px 20px}.execution-mode .topline{margin-bottom:12px}
.execution-mode footer{margin:12px 0 0;padding:8px 0}.execution-mode #guide{display:none}
.work-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}

.conversation-head{padding:18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}

.display-tabs{display:flex;gap:6px;overflow:auto}.display-tabs button{font-size:12px;white-space:nowrap;border:0;background:transparent}

.bone-card{position:absolute;width:198px;text-align:left;border:1px solid #d7e0d0;border-radius:9px;background:#fff;padding:12px;line-height:1.65;box-shadow:0 2px 8px #2c42200a}
.bone-card b{display:block;font-size:12px}.bone-card small{display:block;font-size:10px;color:var(--muted)}.bone-card .bone-artifact{font-size:11px;border-top:1px solid #edf1e9;padding-top:7px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.node-inspector{margin-top:17px;padding:18px;border:1px solid var(--line);border-radius:10px;background:white}.inspector-heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:12px}.inspector-heading h3{margin:0}
.inspector-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;font-size:12px}.inspector-grid h4{font-size:11px;font-weight:500;color:var(--muted);margin:0 0 8px}.inspector-grid p{margin:7px 0}
.locked-content{background:#f3f5ef;border-radius:8px;padding:17px;font-size:12px;line-height:1.9;color:#65715e}
.file-tile{display:flex;gap:11px;align-items:center;text-align:left;width:100%;background:#fcfdfb;padding:12px;margin-bottom:8px;font-size:12px}.file-tile span:first-child{font-size:22px;color:#6c8560}.file-tile small{display:block;font-size:10px;color:var(--muted)}
.file-layout{display:grid;grid-template-columns:170px 1fr;gap:20px}.folder-tree{padding:14px;border-right:1px solid var(--line)}.folder-tree button{width:100%;text-align:left;font-size:12px;border:0;margin-bottom:7px;background:transparent}.folder-tree button.active{background:#e9f1e4}
.document-sheet{max-width:730px;margin:0 auto;background:white;border:1px solid #e1e5db;border-radius:3px;padding:32px 40px;min-height:430px;box-shadow:0 8px 25px #25301e06}.document-sheet h2{font-size:23px;line-height:1.5}.document-sheet h3{font-size:14px;margin-top:25px}.document-sheet p{font-size:13px;line-height:2}.document-sheet .document-meta{font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:24px}
.history-row{background:white;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;padding:17px}.history-row h3{font-size:13px}.history-row p{font-size:12px}.history-row small{font-size:10px;color:var(--muted)}
.workspace-demo-controls{margin-top:10px;font-size:11px;color:var(--muted)}.workspace-demo-controls button{font-size:11px}.workspace-status{margin-top:10px;padding:9px 12px;border-radius:6px;background:#edf3e8;font-size:12px}
.mobile-work-tabs{display:none}.execution-mode .demo select{max-width:220px}
@media(max-width:1100px){.execution-split{grid-template-columns:280px minmax(0,1fr)}.execution-mode main{padding:14px}.work-heading{align-items:flex-start}.display-body{padding:14px}.display-toolbar{padding:9px}.display-toolbar>small{display:none}.inspector-grid{grid-template-columns:1fr}.document-sheet{padding:22px}.file-layout{grid-template-columns:125px 1fr}}
@media(max-width:700px){.execution-mode .shell{display:block}.execution-mode main{padding:12px}.execution-mode aside.show{display:block}.execution-mode aside.show .nav-group,.execution-mode aside.show .person{display:block}.execution-mode aside.show nav button{font-size:13px;text-align:left}.execution-mode aside.show .nav-icon{width:25px}.work-heading{flex-direction:column}.work-heading h1{font-size:20px}.work-heading .actions{justify-content:flex-start}.execution-split{display:block;min-height:650px}.mobile-work-tabs{display:flex;gap:8px;margin:12px 0}.mobile-work-tabs button{flex:1;font-size:12px}.mobile-work-tabs .active{background:#e6f0df;border-color:#aec99c}.execution-split[data-mobile="display"] .conversation-pane{display:none}.execution-split[data-mobile="chat"] .display-pane{display:none}.conversation-pane{border-right:0}.chat-scroll{max-height:400px}.display-body{padding:12px}.display-tabs{gap:0}.display-tabs button{padding:7px 9px}.path-legend{display:none}.inspector-grid{grid-template-columns:1fr}.file-layout{grid-template-columns:1fr}.folder-tree{border-right:0;display:flex;padding:0;gap:4px;overflow:auto}.folder-tree button{white-space:nowrap}.document-sheet{padding:18px}.display-caption{flex-wrap:wrap}.workspace-demo-controls .actions{margin-top:8px}}

/* AI_EXPERIENCE_CSS_START */

.ai-lifecycle{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.ai-lifecycle span{padding:6px 9px;background:#eff3ea;color:#78816f;font-size:10px;border-radius:5px}.ai-lifecycle span.active{background:#dfeccd;color:#315b31;font-weight:600}
.ai-feedback{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:11px;color:var(--muted);flex-wrap:wrap}.ai-feedback button{font-size:11px;padding:5px 9px}

'use strict';
/* PROTOTYPE: no network, credentials, localStorage or production state. */
const DATA=JSON.parse(document.getElementById('design-data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
const tag=(label,cls='')=>`<span class="tag ${cls}">${esc(label)}</span>`;
const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const initial=()=>({baseline:1,budgetBasis:1,candidate:1,contribution:false,review:'未送审',reviewVersion:null,committed:null,readable:true,received:false,assignee:'甲',epoch:1,runEpoch:1,external:'未调用',copies:0,copiedResources:[],preferences:[0,0,0,0],connection:false,mode:'AI协助',selectedTask:'A',tasks:['A','B','C'],notice:'采购A待甲编制方案，各协作人拥有独立工作。',history:['发起人创建采购A、采购B及合同C；实例与任务相互独立。'],drafts:{A:'',B:'',C:''},scenario:'happy',step:0});
let state=initial(),role='main',page='P01',overview=false,category='待我处理',search='',marketFilter='全部资源';
const names={main:'甲',tech:'乙',collab:'丙',writer:'戊',review:'丁',receiver:'己'};
function reasons(s){return [!s.contribution&&'必需专业贡献尚未确认',s.budgetBasis!==s.baseline&&'预算依据已过期',s.reviewVersion!==s.candidate&&'当前成果尚无有效独立审核',s.runEpoch!==s.epoch&&'原执行依据的人员责任已失效',s.external==='结果未知'&&'外部操作结果尚未查证'].filter(Boolean)}
function reduce(previous,action,actor){const s=structuredClone(previous);let note='';const owner=names[actor]===s.assignee;
 const deny=m=>({...s,notice:'已阻止：'+m,history:[...s.history,'已阻止：'+m]});
 if(action==='baseline'){if(actor!=='tech')return deny('只有当前技术资料负责人可确认这项清单变更');if(s.committed)return deny('已交付包不可改写，请发起补充/返工');s.baseline++;s.review='依据变化，待重新审核';s.reviewVersion=null;note='设备清单变为v'+s.baseline+'，预算及依赖稿件待重核；采购B不受影响。'}
 else if(action==='recheck'){if(!owner)return deny('只有当前承担人可确认本人汇总');if(s.committed)return deny('已交付不能覆盖');s.budgetBasis=s.baseline;s.contribution=true;s.candidate++;s.review='未送审';s.reviewVersion=null;note='协作人已确认专业贡献，当前承担人接受并形成方案v'+s.candidate+'。'}
 else if(action==='sendReview'){if(!owner)return deny('仅当前承担人可送审');if(!s.contribution||s.budgetBasis!==s.baseline)return deny('请先补齐并重核必需贡献');if(s.committed)return deny('已交付不能重复送审');s.review='待丁审核';s.reviewVersion=null;note='方案v'+s.candidate+'进入丁的独立审核待办。'}
 else if(action==='approve'){if(actor!=='review')return deny('必须由被指定的独立审核人决定');if(s.review!=='待丁审核')return deny('没有当前有效的审核请求');s.review='已审核';s.reviewVersion=s.candidate;note='丁已审核方案v'+s.candidate+'；甲仍需正式提交。'}
 else if(action==='return'){if(actor!=='review'||s.review!=='待丁审核')return deny('没有本人可办理的审核请求');s.review='退回：请补充报价依据';s.reviewVersion=null;s.epoch++;s.runEpoch=0;s.contribution=false;note='丁退回并给出理由，产生第'+s.epoch+'轮任务；旧执行和审核失效。'}
 else if(action==='commit'){if(!owner)return deny('仅当前承担人可正式提交');if(s.committed)return deny('本轮已提交，返回原交付记录');const r=reasons(s);if(r.length)return deny(r.join('；'));s.committed={version:s.candidate,baseline:s.baseline,epoch:s.epoch,actor:s.assignee};note='方案v'+s.candidate+'正式交付，生成唯一交接包和下游接手任务；流程仍待下游处理。'}
 else if(action==='receive'){if(actor!=='receiver')return deny('只有当前下游接收人可以接手');if(!s.committed)return deny('尚无正式交接包');if(!s.readable)return deny('必需预算附件不可读，请补齐资料权限');if(s.received)return deny('已接手，返回原接收记录');s.received=true;note='己核对了包版本和资料并接手；后续业务仍由流程继续。'}
 else if(action==='unreadable'){s.readable=false;note='模拟必需预算文件对下游不可读，接手必须被阻止。'}
 else if(action==='fixAccess'){if(!['access','knowledgeadmin'].includes(actor))return deny('需由有权的资料维护或授权人员处理');s.readable=true;note='有权人员已补齐该包对接收人的必需读取条件（仅本地模拟）。'}
 else if(action==='transfer'){if(!['assignment','workflow'].includes(actor))return deny('改派需要当前任务范围的派工权限');if(s.committed)return deny('已提交工作不能无痕转办');s.assignee='戊';s.epoch++;s.reviewVersion=null;s.review='新承担人待确认';note='当前承担人改为戊，第'+s.epoch+'轮；甲的运行即使迟到也不能提交。'}
 else if(action==='rebind'){if(!owner)return deny('必须由新承担人确认自己的执行配置');s.runEpoch=s.epoch;note=s.assignee+'已确认本轮配置与资料，旧运行只保留为历史。'}
 else if(action==='unknown'){s.external='结果未知';note='外部请求已发出但未获确定回执；禁止盲目重发或正式提交。'}
 else if(action==='reconcile'){if(!['runtime','main','writer'].includes(actor))return deny('当前无权核对本次外部效果');s.external='已查证：单一外部对象';note='查证到原逻辑动作的唯一外部对象，未再次执行写入。'}
 else if(['copy','copySkill','copyTool'].includes(action)){if(!['main','writer','collab','member','interactor'].includes(actor))return deny('本示例对象没有授予当前视角复制权');const resource={copy:'数字员工',copySkill:'技能',copyTool:'工具'}[action];if(!s.copiedResources.includes(resource))s.copiedResources.push(resource);s.copies=s.copiedResources.length;note='已获得'+resource+'个人副本，保留各自来源版本；重复本次意图返回同一副本。'+(s.connection?'已具备示例使用条件。':'需要配置本人的连接身份。')}
 else if(action==='connect'){if(!['main','writer','collab','member','interactor'].includes(actor))return deny('只能配置本人的连接');s.connection=true;note='本人连接已完成示例配置，没有复制来源作者的凭据。'}
 else if(action==='useCopy'){if(!s.copiedResources.includes('数字员工')||!s.connection)return deny('需先有个人副本并配置本人连接');if(!owner)return deny('只可配置本人承担的工作');note='个人副本已选入采购A当前任务配置，尚未运行。'}
 else if(action==='supplement'){if(!s.committed)return deny('仅已交付工作可发起补充');if(!s.tasks.includes('A-补充'))s.tasks.push('A-补充');note='已创建关联采购A的补充工作，原交接包v'+s.committed.version+'保持不变。'}
 else if(action==='newInstance'){if(actor!=='initiator')return deny('创建流程需要单独的发起权限');const id='N'+s.tasks.length;s.tasks.push(id);note='新业务意图创建独立实例'+id+'，不覆盖同日采购A或B。'}
 else if(action==='human'){if(!owner)return deny('仅当前承担人可配置');s.mode='人工';s.runEpoch=s.epoch;note='已选择人工执行；无需AI或连接凭据，交付与审核条件仍保留。'}
 else if(action==='suggestConfig'){s.aiConfigDraft=true;note='AI配置建议已准备：保留节点必需项，推荐预算助理与已获授权资料；先查看变化再采用。'}
 else if(action==='acceptConfig'){if(!owner)return deny('仅当前承担人可采用本人配置');if(!s.aiConfigDraft)return deny('请先生成并查看建议');s.aiConfigAccepted=true;s.runEpoch=s.epoch;note='已采用推荐配置。没有新增权限、修改他人配置或自动执行。'}
 else if(action==='analyze'){s.analysis=true;note='已基于原型内'+s.tasks.length+'笔虚构业务生成分析；生产需授权查询、口径与来源验证。'}
 else if(action==='confirmFact'){s.factConfirmed=true;note='已在示例中确认设备与采购事项的关系；候选关系和正式事实分开，不新增读取权。'}
 else if(action==='proactiveDraft'){s.proactiveDraft=true;note='主动AI已准备待核对草稿；未发送消息、未提交审批、未执行外部写入。'}
 else if(action==='dismissSuggestion'){s.suggestionDismissed=true;note='本次建议已忽略，不会反复提醒；正式任务仍保留在待办。'}
 else if(action==='evaluateEvolution'){s.evolutionEvaluated=true;note='展示示例对照评估：新方法仍为待评审提案，不改变权限或当前在途执行。'}
 else if(action==='savePreference'){s.preferenceSaved=true;note='仅保存本人的演示偏好；组织政策和业务硬条件保持优先。'}
 else return deny('该操作不属于本原型的可执行场景');
 s.notice=note;s.history.push(note);return s;}
const scenarios={happy:{name:'正常协作与交接',desc:'各人完成自己的职责，审核与正式提交、接手分开。',steps:[['main','recheck','甲接受合格贡献'],['main','sendReview','甲送审当前版本'],['review','approve','丁独立审核'],['main','commit','甲正式提交'],['receiver','receive','己核对并接手']]},stale:{name:'输入变化与旧结果',desc:'已审核结果依赖的清单更新后，旧结果不能提交；重核后可恢复。',steps:[['main','recheck','汇总原贡献'],['main','sendReview','送审'],['review','approve','审核原版本'],['tech','baseline','乙更新清单'],['main','commit','尝试提交旧结果'],['main','recheck','重新核对贡献'],['main','sendReview','重新送审'],['review','approve','审核新版本'],['main','commit','提交新版本']]},transfer:{name:'转办与迟到运行',desc:'当前人变更使原运行失去提交权，新人必须确认自己的配置。',steps:[['main','recheck','甲汇总'],['assignment','transfer','改派给戊'],['main','commit','甲尝试迟到提交'],['writer','rebind','戊确认本轮配置'],['writer','recheck','戊重核贡献'],['writer','sendReview','戊送审'],['review','approve','丁审核'],['writer','commit','戊正式提交']]},blocked:{name:'交接资料不可读',desc:'通知已收到，但必需附件无读权，必须由有权人修复再接手。',steps:[['main','recheck','接受贡献'],['main','sendReview','送审'],['review','approve','审核'],['main','commit','正式交付'],['receiver','unreadable','模拟缺必需读权'],['receiver','receive','尝试接手'],['access','fixAccess','有权人员补齐'],['receiver','receive','重新接手']]},unknown:{name:'外部结果未知',desc:'避免因超时再创建外部业务对象，先查证原动作。',steps:[['main','recheck','接受贡献'],['main','sendReview','送审'],['review','approve','审核'],['main','unknown','模拟外部超时'],['main','commit','尝试交付'],['runtime','reconcile','查证唯一外部结果'],['main','commit','完成正式交付']]},market:{name:'市场复制与使用',desc:'复制定义不复制作者凭据，重复请求也不能多建副本。',steps:[['main','copy','复制预算助理'],['main','copy','重复同一意图'],['main','useCopy','缺本人连接时使用'],['main','connect','配置本人连接'],['main','useCopy','用于本人任务']]},rework:{name:'审核退回后恢复',desc:'退回产生新责任轮次，保留理由并重新配置、核对与审核。',steps:[['main','recheck','汇总贡献'],['main','sendReview','送审'],['review','return','退回补充报价'],['main','commit','尝试旧轮次提交'],['main','rebind','确认新轮次配置'],['main','recheck','补齐并重核'],['main','sendReview','重新送审'],['review','approve','审核新版'],['main','commit','正式交付']]}};
</script>
<script>
function navigate(id){page=id;const url=new URL(location.href);url.searchParams.set('page',id);history.replaceState(null,'',url);render();window.scrollTo(0,0)}
function goto(id,label,cls=''){return `<button data-page="${id}" class="${cls}">${label}</button>`}
function heading(title,desc,actions=''){return `<div class="heading"><div><div class="eyebrow">OA / DIGITAL WORKFORCE</div><h1>${title}</h1><p class="muted">${desc}</p></div><div class="actions">${actions}</div></div>`}
function assistant(title,body,actions=''){return `<div class="notice"><strong>✦ ${title}</strong><div>${body}</div><div class="actions" style="margin-top:10px">${actions}</div></div>`}
function infoState(){return `<div class="statebar"><div class="stateitem"><span>当前责任</span>${esc(state.assignee)} · 第${state.epoch}轮</div><div class="stateitem"><span>业务基线 / 预算依据</span>v${state.baseline} / v${state.budgetBasis}</div><div class="stateitem"><span>成果 / 审核版本</span>v${state.candidate} / ${state.reviewVersion?'v'+state.reviewVersion:'尚无有效审核'}</div><div class="stateitem"><span>正式交付 / 下游接手</span>${state.committed?'已交付v'+state.committed.version:'未交付'} / ${state.received?'已接手':'未接手'}</div></div>`}
function taskTabs(active){return `<div class="tabs">${[['P02','任务概览'],['P11','与AI协作'],['P03','参与者与分工'],['P04','本次配置'],['P20','依据与变化'],['P10','文件与成果'],['P16','审核与交接']].map(([p,n])=>goto(p,n,p===active?'active':'')).join('')}</div>`}
function inbox(){const titles={A:'研发实验室 · 设备采购方案',B:'办公区 · 显示器采购',C:'年度技术服务合同'};let rows=state.tasks.map((id,i)=>({id,title:titles[id]||'新建独立业务事项',number:id==='C'?'HT-示例-003':'CG-示例-'+String(i+1).padStart(3,'0'),node:id==='C'?'法务审核':i===1?'预算协作':'方案编制',role:id==='C'?'审核人':i===1?'协作人':'主执行人'}));const masked=!['main','tech','collab','writer','review','receiver','responsible','member','initiator','interactor'].includes(role);if(masked)rows=rows.map((x,i)=>({...x,title:'授权事项摘要 '+(i+1),number:'脱敏业务引用 '+(i+1),role:'本管理域元数据'}));if(search)rows=rows.filter(x=>(x.title+x.number).includes(search));if(category==='我已处理')rows=state.committed?rows.filter(x=>x.id==='A'):[];if(category==='抄送我的')rows=rows.filter(x=>x.id==='C');return heading('我的工作','从需要你处理的事项开始。每一笔业务都有独立的责任与交付。',(role==='initiator'?btn('发起新流程','newInstance','primary'):'')+(allowedPages().has('P22')?goto('P22','资源市场'):''))+`<div class="stats">${[[String(rows.length),'当前视图事项'],[String(new Set(rows.map(x=>x.id)).size),'独立业务实例'],[String(new Set(rows.map(x=>x.id==='C'?'合同':'采购')).size),'流程类型'],[String(state.baseline!==state.budgetBasis?1:0),'需要关注的依据变化']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>`+(!state.suggestionDismissed?assistant('先把下一步准备好',(state.committed?'方案已交付，可核对下游接收条件。':state.contribution&&state.baseline===state.budgetBasis?'专业贡献已核对，可继续当前版本的审核与交付。':'采购方案的专业贡献待核对。AI可以先整理依据和草稿，你决定是否采用。'),btn(state.proactiveDraft?'草稿已准备':'帮我准备草稿','proactiveDraft')+goto('P20','查看依据')+btn('暂不提醒','dismissSuggestion')):'')+`<div class="panel"><div class="tabs">${['待我处理','待领取','我已处理','我发起的','抄送我的'].map(x=>`<button data-category="${x}" class="${category===x?'active':''}">${x}</button>`).join('')}</div><div class="toolbar"><input aria-label="搜索事项" type="search" placeholder="搜索单号或事项名称" value="${esc(search)}"><span class="muted">列表仅呈现该演示视角的授权摘要</span></div>${rows.length?table(['单号 / 事项','当前节点 · 我的职责','到期','业务状态','下一步'],rows.map(x=>[`<span class="sub">${x.number}</span><span class="titlecell">${x.title}</span>`,x.node+'<span class="sub">'+x.role+'</span>','今天 17:00',tag(x.id==='A'?(state.committed?'已交付，待下游':state.budgetBasis!==state.baseline?'依据待重核':'待处理'):'待处理',x.id==='A'&&state.budgetBasis!==state.baseline?'warn':''),`<button ${masked?'disabled':'data-task="'+x.id+'"'} class="small">${masked?'仅查看授权元数据':category==='待领取'?'查看并领取':category==='抄送我的'?'阅读事项':'打开任务'} →</button>`])):'<div class="empty">当前没有符合条件的事项。<br>可清除筛选或切换队列。</div>'}</div>`}
function taskFrame(content){const task=state.selectedTask;if(task!=='A')return heading('独立业务实例 '+esc(task),'当前草稿与采购A分开。复杂闭环演练固定使用A，避免混用状态。',goto('P01','返回工作'))+`<div class="panel"><h2>本笔业务的私人草稿</h2><label>补充内容<textarea id="draft">${esc(state.drafts[task]||'')}</textarea></label>${btn('保存本任务草稿','saveDraft','primary')}<p class="muted">此实例的审核、运行和贡献不使用采购A的模拟状态。</p></div>`;return heading(task==='A'?'研发实验室 · 采购方案编制':task==='B'?'办公区 · 预算协作':'年度合同 · 法务审核',`CG-示例-${task} · ${task==='A'?'甲/戊当前责任由示例状态决定':'该实例资料、草稿和运行与采购A隔离'}`,goto('P01','返回工作'))+(task==='A'?`<div class="meta"><div><span>本人职责</span>${esc(state.assignee)} · 汇总方案</div><div><span>当前轮次</span>第${state.epoch}轮</div><div><span>交付标准</span>方案、清单、预算及有效审核</div><div><span>下一接收人</span>采购执行岗 · 己</div></div>${taskTabs(page)}`:`<div class="notice">正在查看实例${esc(task)}；下方草稿只保留在该实例。闭环演练固定使用采购A。</div>`)+content}
function workspace(){return taskFrame(`<div class="columns"><div><div class="panel"><h2>把这项工作向前推进</h2><div class="steps"><div class="step">需求发起</div><span class="arrow">→</span><div class="step current">方案编制</div><span class="arrow">→</span><div class="step">独立审核</div><span class="arrow">→</span><div class="step">采购执行</div></div><p>基于已确认设备清单和预算，形成可交给采购岗位执行的方案。AI负责准备候选，你核对并交付。</p>${assistant('推荐下一步',state.budgetBasis!==state.baseline?'先核对清单变化，再更新预算与方案。':'先查看贡献与依据，再请AI整理方案。',goto('P03','核对专业贡献')+goto('P04','使用推荐AI配置'))}<label>我的任务草稿<textarea id="draft" placeholder="记录本笔业务的补充要求…">${esc(state.drafts[state.selectedTask]||'')}</textarea></label><div class="actions">${btn('保存本任务草稿','saveDraft')} ${goto('P11','与AI继续处理','primary')}</div></div><div class="panel"><h2>业务动态</h2><div class="feed">${state.history.slice(-4).map((s,i)=>`<div class="feed-item"><strong>业务记录 ${i+1}</strong><p>${esc(s)}</p></div>`).join('')}</div></div></div><div><div class="panel"><h3>交付检查</h3>${[['专业贡献',state.contribution],['依据版本一致',state.baseline===state.budgetBasis],['独立审核',state.reviewVersion===state.candidate],['已正式提交',!!state.committed]].map(([n,ok])=>`<div class="check">${n}${tag(ok?'已满足':'待处理',ok?'':'warn')}</div>`).join('')}${goto('P16','查看交付与审核')}</div><div class="panel"><h3>业务资料</h3><p>设备清单 v${state.baseline}<br>预算依据 v${state.budgetBasis}<br>方案候选 v${state.candidate}</p>${goto('P20','查看来源与变化')}</div></div></div>`)}
function configuration(){return taskFrame(assistant('已经替你匹配好，先做业务','默认沿用节点认可的数字员工、资料与工具。只在缺资料、缺本人连接或希望调整时补充设置。',btn('帮我检查推荐配置','suggestConfig','primary'))+`<div class="panel"><h2>本次协助方式</h2><div class="grid two"><div class="card"><div class="avatar">✦</div><h3>采购方案助理</h3><p>负责汇总已确认清单、预算和引用，准备待审核方案。</p>${tag('节点推荐 · v2')}${tag('沿用当前权限')}</div><div class="card"><h3>准备情况</h3><div class="check">必需资料${tag(state.baseline===state.budgetBasis?'版本一致':'预算需重核',state.baseline===state.budgetBasis?'':'warn')}</div><div class="check">保存范围${tag('仅本次任务')}</div><div class="check">工作方式${tag(state.mode)}</div>${btn('改为人工执行','human')}</div></div>${state.aiConfigDraft?`<div class="notice" style="margin-top:16px"><strong>推荐配置变化</strong><p>保留：当前业务输入、审核规则、组织预算。<br>推荐：采购方案助理v2，附上已授权清单和预算引用。<br>不会增加任何权限，不改变其他任务。</p>${btn(state.aiConfigAccepted?'已采用推荐':'采用本次推荐','acceptConfig','primary')}</div>`:''}<details style="margin-top:20px"><summary>需要时调整：技能、知识、连接身份与执行上限</summary><div class="form" style="margin-top:14px"><label>使用技能<select><option>方案撰写 + 数据核对（模板推荐）</option><option>仅数据核对</option></select></label><label>连接身份<select><option>本人已授权查询身份</option><option>选择其他已获准身份</option></select></label><label>结果格式<select><option>方案文档 + 清单表</option></select></label><label>运行上限<select><option>沿用组织和本任务上限</option></select></label></div><p class="muted">此处为字段设计演示，真实候选由服务端按当前任务计算。</p></details></div>`)}
function collaborationPage(){return taskFrame(`<div class="panel"><h2>分工清楚，各自使用自己的AI</h2>${table(['参与人 / 职责','数字员工','依据与贡献','动作'],[['乙 · 技术协作','技术清单助理',`设备清单 v${state.baseline}`,btn('模拟确认新清单','baseline','small')],['丙 · 预算协作','预算助理',`预算依据 v${state.budgetBasis} `+tag(state.baseline===state.budgetBasis?'可核对':'待重核',state.baseline===state.budgetBasis?'':'warn'),goto('P20','查看变化','small')],['戊 · 写作协作','材料助理','根据已接受资料撰写，私人草稿不共享',goto('P10','查看候选','small')],['丁 · 独立审核','审核辅助AI',state.review,goto('P16','进入审核','small')]])}<div class="actions" style="margin-top:16px">${btn('核对并接受当前合格贡献','recheck','primary')}${btn('模拟改派给戊','transfer')}${btn('新承担人确认本轮配置','rebind')}</div></div><div class="notice">以上动作受演示角色检查。主执行人能看贡献与进度，不能编辑协作人的私人数字员工、连接或记忆。</div>`)}
function contextPage(){return taskFrame(`<div class="notice ${state.baseline!==state.budgetBasis?'warn':''}"><strong>${state.baseline!==state.budgetBasis?'需要重核：设备数量已变更':'当前必需事实版本一致'}</strong><p>共享业务依据保持一致；每位参与人只读其职责需要的字段。其他实例不会因本次变更停工。</p></div><div class="panel"><h2>本次使用的依据</h2>${table(['资料 / 事实','当前版本','本次使用','来源与可见范围'],[['设备清单','v'+state.baseline,'v'+state.budgetBasis,'技术协作人确认 · 授权参与者'],['采购硬条件','v1','v1','流程模板 · 必需保留'],['私人采购笔记','仅本人','未共享','不进入协作人和下游投影'],['模型上下文装载','仅原型展示','没有真实装载证据','不能将模拟状态认定为AI实际理解']])}<div class="actions" style="margin-top:16px">${btn('模拟清单更新','baseline')}${btn('依据新版重新核对','recheck','primary')}</div></div>${infoState()}`)}
function deliveryPage(){const rs=reasons(state);return taskFrame(`<div class="columns"><div><div class="panel"><h2>审核当前成果</h2><p>方案候选 <strong>v${state.candidate}</strong> · 设备清单v${state.baseline} · 预算依据v${state.budgetBasis}</p>${tag(state.review,state.reviewVersion===state.candidate?'':'warn')}<div class="actions" style="margin-top:17px">${btn('送审当前版本','sendReview')}${btn('独立审核通过','approve','primary')}${btn('退回并要求补充','return')}</div><p class="audit-description">执行人与审核人分别操作。退回产生新轮次，更新成果后旧审核不再适用。</p></div><div class="panel"><h2>正式交付</h2>${rs.length?`<div class="notice warn">当前提交条件：${rs.map(esc).join('；')}</div>`:'<div class="notice">当前版本的交付前置已满足，仍需承担人正式提交。</div>'}<div class="actions">${btn(state.committed?'查询原提交结果':'正式提交当前方案','commit','primary')}${btn('发起补充工作','supplement')}</div>${state.committed?`<p>不可变交接包：方案v${state.committed.version} / 依据v${state.committed.baseline} / 第${state.committed.epoch}轮 / 确认人${state.committed.actor}</p>`:''}</div></div><div><div class="panel"><h3>下游接手</h3><div class="check">交接包${tag(state.committed?'已生成':'未生成',state.committed?'':'warn')}</div><div class="check">必需文件${tag(state.readable?'可读取':'不可读取',state.readable?'':'bad')}</div><div class="check">接手记录${tag(state.received?'已接手':'待接手')}</div><div class="actions">${btn('核对并接手','receive','primary')}${btn('模拟缺资料读权','unreadable')}${btn('有权人员补齐读取','fixAccess')}</div></div><div class="panel"><h3>外部效果</h3><p>${esc(state.external)}</p><div class="actions">${btn('模拟结果未知','unknown')}${btn('查证原操作','reconcile')}</div></div></div></div>${infoState()}`)}
function conversationPage(){return taskFrame(`<div class="panel"><h2>围绕任务与AI协作</h2><div class="bubble person-message"><strong>甲 · 工作要求</strong><p>请依据当前设备清单和预算整理采购方案，保留每项费用来源。</p></div><div class="bubble"><strong>✦ 采购方案助理 · 示例回答</strong><p>我会先核对设备数量与预算口径，再准备方案草稿。${state.baseline!==state.budgetBasis?'预算仍基于旧清单，需要先重核。':'当前依据版本一致，草稿将保留引用。'}</p>${goto('P20','看使用依据')}${goto('P10','看候选成果')}</div><label>补充本任务要求<textarea id="draft" placeholder="直接说你希望调整什么，不需要写提示词配置…">${esc(state.drafts[state.selectedTask]||'')}</textarea></label><div class="actions">${btn('保存本任务补充','saveDraft','primary')}${goto('P04','查看默认协助配置')}</div><p class="audit-description">本原型不调用模型；真实系统显示实际进度、可修改建议和必要的人员确认。</p></div>`)}
function artifactsPage(){return taskFrame(`<div class="panel"><h2>工作成果与版本</h2>${table(['产物','版本 / 依据','状态','查看'],[['采购方案.docx（示例名称）',`v${state.candidate} / 清单v${state.baseline}`,tag(state.committed?'已交付版本可追溯':'候选待确认'),goto('P16','检查交付','small')],['设备清单.xlsx（示例名称）','v'+state.baseline,tag('技术贡献'),goto('P20','查看依据','small')],['预算测算.xlsx（示例名称）','依据v'+state.budgetBasis,tag(state.baseline===state.budgetBasis?'可核对':'待重核',state.baseline===state.budgetBasis?'':'warn'),goto('P20','查看差异','small')]])}<p class="audit-description">文件名用于示意，不提供虚构下载链接。正式产品必须能打开实际对象存储中的版本。</p></div>`)}
function cards(items){return `<div class="grid">${items.map(([icon,title,desc,badges,action])=>`<article class="card"><div class="avatar">${icon}</div><h3>${title}</h3><p>${desc}</p><div>${badges}</div><div class="actions" style="margin-top:15px">${action}</div></article>`).join('')}</div>`}
function resourcePage(){
 if(page==='P22'){
 const catalog=[

 else if(action==='save-plan'){if(c.planDraft){ai.plans[role]={status:'draft',revision:1};c.planDraft=null;c.notice='计划草稿已保存，尚未启用。';}}
 else if(action==='enable-plan'||action==='pause-plan'){if(ai.plans[role]){ai.plans[role].status=action==='enable-plan'?'enabled':'paused';c.notice='仅更新计划演示状态，没有创建真实定时任务。';}}
 else if(action==='evaluateEvolution'){state.evolutionEvaluated=true;c.notice='已展开证据样例，实际业务评估仍待执行。';}
 else if(action.startsWith('evo-')){if(!canMaintain())c.notice='当前无权维护或发布此方法。';else if(action==='evo-propose'&&e.status==='draft'&&state.evolutionEvaluated){e.author=role;e.status='evaluated';c.notice='已登记提案与虚构评估样例。';}else if(action==='evo-review'&&e.status==='evaluated'&&role==='evolution'&&role!==e.author){e.reviewer=role;e.status='reviewed';c.notice='已模拟独立复核。';}else if(action==='evo-trial'&&e.status==='reviewed'&&e.reviewer===role){e.status='trial';c.notice='试用仅限下一笔获准任务，7天或1次后停止（模拟）。';}else if(action==='evo-receipt'&&e.status==='trial'&&e.reviewer===role){e.receipt=true;c.notice='已载入虚构试用回执，不是真实效果评估。';}else if(action==='evo-publish'&&e.status==='trial'&&e.receipt&&e.reviewer===role){e.status='published';e.active=2;c.notice='默认方法已切到 v2 样例，在途任务仍固定 v1。';}else if(action==='evo-rollback'&&e.status==='published'&&e.reviewer===role){e.status='rolled_back';e.active=1;c.notice='默认方法已回退 v1，历史与在途版本保留。';}else c.notice='已阻止：缺少前置证据、独立复核或当前动作权限。';}
 else if(['helpful','inaccurate','ignore'].includes(action)){ai.feedback[aiKey()+':'+page]={helpful:'已记录有帮助',inaccurate:'已标记待纠正',ignore:'本次暂不采用'}[action];c.notice='反馈仅为本次记录，未写入长期记忆或发布改进。';}
 else if(action==='context-help'){if(executionPages.has(page)){workbench.mobile='chat';}else c.help=true;}
 else if(action==='close-help')c.help=false;else if(action==='save-help'){c.helpDrafts=c.helpDrafts||{};c.helpDrafts[page]=document.querySelector('#ai-help-draft')?.value||'';c.notice='当前人员、任务与页面的草稿已保存，尚未执行任何动作。';}
 state.notice=c.notice||state.notice;
}
const interceptedAI=new Set(['suggestConfig','acceptConfig','savePreference','analyze','confirmFact','proactiveDraft','dismissSuggestion','evaluateEvolution']);
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.id==='reset'){ai=freshAI();return;}const action=b.dataset.ai||(interceptedAI.has(b.dataset.action)?b.dataset.action:null);if(!action&&!b.dataset.aiTask)return;if(executionPages.has(page)&&document.querySelector('#draft'))workbench.drafts[aiKey()]=document.querySelector('#draft').value;event.preventDefault();event.stopImmediatePropagation();if(b.dataset.aiTask){if(visibleAnalysisRows().some(x=>x.id===b.dataset.aiTask)){state.selectedTask=b.dataset.aiTask;page='P02';}}else aiAction(action);render();if(action==='context-help'&&executionPages.has(page))document.querySelector('#draft')?.focus();},true);
document.addEventListener('change',event=>{const t=event.target,c=aiContext();if(t.id==='ai-analysis-mode')c.analysisMode=t.value;const d=page==='P04'?c.configDraft:c.preferenceDraft;if(d&&t.dataset.aiCheck!==undefined)d.selected[Number(t.dataset.aiCheck)]=t.checked;if(d&&t.dataset.aiValue!==undefined)d.values[Number(t.dataset.aiValue)]=Number(t.value);});
window.AIExperienceDesign={snapshot:()=>structuredClone({role,page,context:aiContext(),preferences:aiPrefs(),config:aiConfig(),knowledge:ai.knowledge,evolution:ai.evolution,plan:ai.plans[role]||null,feedback:ai.feedback}),fixtureOnly:true};

/* AI_EXPERIENCE_JS_END */
const params=new URLSearchParams(location.search);if(DATA.pages.some(p=>p.id===params.get('page')))page=params.get('page');if(DATA.roles.some(p=>p.profileId===params.get('role')))role=params.get('role');overview=params.get('design')==='1';
window.OADesignPrototype={snapshot:()=>structuredClone({state,role,page,overview}),designPages:DATA.pages.map(p=>p.id),scenarios:Object.keys(scenarios)};render();
</script>
