name: local-development-system
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # make verify 依赖 ~/.agents/skills/ai-native-sdlc；从仓内便携包安装并校验摘要
      - run: make install-shared-skills
      - run: make verify
# 无部署或自动合并。共享 Skill 来自 validation/development-ai-native-sdlc-v2.0.0.zip。
